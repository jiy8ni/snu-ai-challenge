# RunPod 버전 — Qwen3-VL-8B QLoRA SFT, **_0716 No_ordering 재해석 라운드 (plain)**
#
# configs/sft_qwen8b.yaml(Colab)과 동일한 레시피이며, RunPod 볼륨(/workspace/snuai)에
# 맞춰 output_dir·runpod.base_dir·save 정책만 바꾼다. 학습 데이터는 클린 SFT 데이터
# (outputs/sft_train.jsonl, 외부 LLM 증강 없음)를 --sft-jsonl로 지정한다.
#
# 큰 산출물은 전부 /workspace/snuai 아래에 둬 root disk quota 초과를 피한다.
model: unsloth/Qwen3-VL-8B-Instruct   # 원본 공개 2025-10-15 (<=2026-05-31 규정 충족)
load_in_4bit: true                    # nf4, compute dtype bf16
output_dir: /workspace/snuai/outputs/qwen3vl8b_0716

runpod:
  base_dir: /workspace/snuai          # 캐시·tmp 라우팅 (configure_disk_cache). RunPod에선
                                      # /workspace 감지 시 자동이지만 명시해 둔다.

pixels:
  min: 25088      # 32 * 28 * 28
  max: 250880     # 320 * 28 * 28 — OOM 시 200704(256*28^2)

lora:
  r: 16
  alpha: 16
  dropout: 0.0
  finetune_vision_layers: true
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true

train:
  epochs: 3
  per_device_batch: 1            # 안전 기본. A100 40GB는 --per-device-batch 2 --grad-accum 8 권장
  grad_accum: 16                 # 유효 배치 16 고정
  lr: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 0.3
  max_seq_len: 2048
  seed: 42
  save_steps: 500                # RunPod 볼륨 쓰기 절약
  save_total_limit: 1            # 최신 checkpoint-* + final lora/만 유지
  logging_steps: 10
  train_on_responses_only: true
  dataloader_num_workers: 8   # RunPod A100 vCPU에 맞춰 (num_workers=0이면 GPU가 이미지 로딩 대기 -> 37s/it)

data:
  style: plain                   # UNORDERABLE 제거, 순수 24-way (src/train/targets.py 참조)
  identity_prior: 0.155          # plain 전용: 타깃이 identity(=이미 시간순)일 확률 = test 사전확률
  letterbox_crop: true
  perm_augment: true             # plain이면 augment_perm_truthful (라벨 항상 진실)
  oversample_no_ordering: 1      # plain에선 반드시 1 (identity 비중은 identity_prior가 전담)
  caption_aug_prob: 0.45         # rule 기반 캡션 변형 확률 (외부 LLM 증강은 철회)
  # hard_cases_path 생략: 클린 SFT v1은 오버레이 없이 학습 (클린 데이터 sft_train.jsonl)
  hard_aug_repeats_field: caption_aug_repeats
  hard_aug_max_repeats: 1        # **클린 SFT v1: 하드 반복 off.** 오버레이 없이 도므로 반복도 1.
                                 # 진짜 부스팅은 클린 모델 자신의 오답으로 재채굴 후 GRPO 단계에서.
