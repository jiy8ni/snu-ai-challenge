# Track B (Qwen2.5-VL-7B QLoRA SFT, Unsloth/A100) 학습 설정 — _0707 라운드
# _0706(LB 0.81) 대비 변경: epochs 2->3, no_ordering 오버샘플 x2 (근거: track_b_0707.md).
# 3B(_0705, LB 0.71) 설정은 snuai_code_0705.zip에 동결. 7B는 T4 학습 불가 — A100/L4 전용.
# 최종 환경 3090 24GB 추론: 7B bf16 ~16.6GB 적재 가능 (빠듯하면 4bit, 규정 허용).
model: unsloth/Qwen2.5-VL-7B-Instruct   # 4bit 프리팩. 원본 공개 2025-01 (<=2026-05-31)
load_in_4bit: true                       # nf4, compute dtype bf16 (A100)
output_dir: /kaggle/working/outputs/qwen25vl7b

pixels:
  min: 25088      # 32 * 28 * 28  — 작은 프레임 강제 업스케일 방지
  max: 250880     # 320 * 28 * 28 — 640x360도 native, 이상치만 캡. OOM 시 200704(256*28^2)

lora:
  r: 16
  alpha: 16
  dropout: 0.0
  finetune_vision_layers: true
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true

train:
  epochs: 3                      # _0707: 2 -> 3 (수렴 여유. cosine이 전체 길이에 맞춰 재스케줄됨)
  per_device_batch: 1            # 안전 기본값. A100은 노트북 B2 OVERRIDES {2, 8}로 조정
  grad_accum: 16                 # 유효 배치 16 고정 (3B _0705와 비교 가능성 유지)
  lr: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 0.3             # fp16 안정화: 낮게 시작
  max_seq_len: 2048
  seed: 42
  save_steps: 200                # 세션 12h 초과 대비 체크포인트
  save_total_limit: 2            # 오래된 checkpoint-* 자동 삭제
  logging_steps: 10
  train_on_responses_only: true

data:
  style: mid                     # cot | mid | short — **미검증 기본값**. reports/preprocessing.md
                                 # B2("타깃 포맷 cot/mid/short")는 val EM 칸이 비어 있다(미실행).
                                 # 알려진 부작용(2026-07-15 실측): mid는 orderable이 "Order:"로,
                                 # no_ordering이 "Conclusion:"으로 시작해 ORDERABLE/UNORDERABLE
                                 # 결정이 토큰 0에서 난다. 학습 타깃 84.5%가 "Order:"라 모드 붕괴 —
                                 # 생성 6,552건 전부 "Order:"로 시작하고 UNORDERABLE 출력 0건.
  letterbox_crop: true
  perm_augment: true
  oversample_no_ordering: 1      # _0715: 2 -> 1. hard_cases_path가 no_ordering에 repeats~4를
                                 # 이미 주므로 x2와 곱하면 이중 부스팅 (비중 40.5% — identity 과베팅).
                                 # 1로 두면 25.4%로 _0707의 검증된 26.8%와 동등, 재분배만 일어남.
  caption_aug_prob: 0.45         # rule 기반 캡션 변형 확률 (외부 LLM 증강은 철회)
  hard_cases_path: outputs/hard_train_cases.csv   # 상대경로: 로컬=repo/outputs, Colab=cwd(/content)/outputs
  hard_aug_repeats_field: caption_aug_repeats
  hard_aug_max_repeats: 5
