# Track B (Qwen3-VL-8B QLoRA SFT, Unsloth/A100) — **Phase 1.5 재채굴 부스팅 (_0717)**
#
# 기준선: 8B + plain + TTA8 (_0716). 이 config는 거기서 **데이터 가중치만** 바꾼다
# (단일변수 원칙): hard_aug_max_repeats 1->5. 가중치 소스는 클린 모델 자신의 train-fold
# 오답 재채굴(hard_train_cases_clean.csv, docs/runpod.md §8). 클린 SFT 데이터(sft_train.jsonl)
# 위에 hard_cases_path CSV 오버레이로 재가중 필드(caption_aug_repeats/prob/hard_score)를
# 덮어쓴다 — 외부 LLM 증강 없이 모델 예측 기반 재채굴만으로 부스팅한다.
#
# 이 파일은 RunPod 실행 경로(configs/sft_qwen8b_v2_runpod.yaml)의 Colab 문서 쌍둥이다.
# 이번 라운드 실제 실행은 RunPod CLI (docs/runpod.md §7.9).
model: unsloth/Qwen3-VL-8B-Instruct   # load_in_4bit로 unsloth dynamic 4bit 자동 매핑
load_in_4bit: true                    # nf4, compute dtype bf16 (A100)
output_dir: /content/outputs/qwen3vl8b_0717   # 노트북에서 Drive 경로로 오버라이드

pixels:
  min: 25088      # 32 * 28 * 28
  max: 250880     # 320 * 28 * 28 — OOM 시 200704(256*28^2)

lora:
  r: 16
  alpha: 16
  dropout: 0.0
  finetune_vision_layers: true
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true

train:
  epochs: 3
  per_device_batch: 1            # 8B 안전 기본값. A100 40GB 여유 있으면 노트북 OVERRIDES {2, 8}
  grad_accum: 16                 # 유효 배치 16 고정
  lr: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 0.3
  max_seq_len: 2048
  seed: 42
  save_steps: 200                # 세션 12h 초과 대비 체크포인트
  save_total_limit: 2            # 오래된 checkpoint-* 자동 삭제
  logging_steps: 10
  train_on_responses_only: true
  dataloader_num_workers: 8   # RunPod A100 vCPU에 맞춰 (num_workers=0이면 GPU가 이미지 로딩 대기 -> 37s/it)

data:
  style: plain                   # UNORDERABLE 제거, 순수 24-way (src/train/targets.py 참조)
  identity_prior: 0.155          # plain 전용: 타깃이 identity(=이미 시간순)일 확률 = test 사전확률
  letterbox_crop: true
  perm_augment: true             # plain이면 augment_perm_truthful (라벨 항상 진실)
  oversample_no_ordering: 1      # **plain에선 반드시 1(off)**. identity 비중은 identity_prior가
                                 # 전담하므로 ×2와 곱하면 이중 부스팅 -> identity 과베팅.
  caption_aug_prob: 0.45         # rule 기반 캡션 변형 확률 (외부 LLM 증강은 철회)
  # CSV가 caption_aug_repeats/prob/hard_score를 레코드 위에 덮어쓴다
  # (vl_dataset._load_hard_case_overrides 허용 키 3종). 클린 재채굴 CSV를 지정한다.
  # hard_cases_path: /content/drive/MyDrive/snuai/hard_train_cases_clean.csv
  hard_aug_repeats_field: caption_aug_repeats
  hard_aug_max_repeats: 5        # **Phase 1.5의 유일한 레시피 변경.** 새 채굴 repeats(1..5)를
                                 # 물리 복제로 반영 — 0716은 1(off)이었다(구 tta1 채굴 아티팩트라).
                                 # 진짜 부스팅: 이 모델 자신의 tta4 오답 재채굴 (colab H1' 셀).
